# 基础设施编排 —— 按需分层，不必一次全起
#
#   docker compose up -d postgis redis           # 最小可运行（实时链路走 direct 模式）
#   docker compose up -d --profile stream        # 追加 Kafka（双消费者组）
#   docker compose up -d --profile tds           # 追加 TDengine（过车/轨迹时序）
#   docker compose up -d --profile obj           # 追加 MinIO（抓拍图对象存储）
#
# 全部起：docker compose --profile stream --profile tds --profile obj up -d
#
# 应用侧对每个中间件都做了降级：连不上就退到内存/直连实现，并在 /api/health 如实报告。

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: traffic-postgis
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgis/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: traffic-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: traffic-kafka
    profiles: ["stream"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  tdengine:
    image: tdengine/tdengine:3.2.3.0
    container_name: traffic-tdengine
    profiles: ["tds"]
    environment:
      TAOS_FQDN: localhost
    ports:
      - "6030:6030"
      - "6041:6041"
    volumes:
      - tddata:/var/lib/taos
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:6041/rest/sql' -u root:taosdata -d 'show databases' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: traffic-minio
    profiles: ["obj"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: traffic
      MINIO_ROOT_PASSWORD: traffic123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: traffic-minio-init
    profiles: ["obj"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 traffic traffic123 &&
      mc mb -p local/snapshots &&
      mc anonymous set download local/snapshots &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  tddata:
  miniodata:
